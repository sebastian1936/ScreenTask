name: Build & Release ScreenTask

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Build Solution (Release)
      run: msbuild ScreenTask.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /restore

    - name: Package as ZIP
      run: |
        $ver = "dev-$($env:GITHUB_RUN_NUMBER)"
        Compress-Archive -Path "ScreenTask/bin/Release/*" -DestinationPath "ScreenTask-$ver.zip" -Force
        echo "RELEASE_VER=$ver" >> $env:GITHUB_ENV

    - name: Update Release (overwrite)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: ScreenTask Latest Build (#${{ github.run_number }})
        body: |
          ## ScreenTask - 自动构建 #${{ github.run_number }}
          **提交**: `${{ github.sha }}`
          **分支**: ${{ github.ref_name }}
          **构建时间**: ${{ github.event.head_commit.timestamp }}

          ---
          - Share your screen across local devices without internet.
          - WebUI: No additional software needed.
          - Basic authentication support for private sessions.
          - Multi-screen support.

          ### How to use:
          1. Download and unzip
          2. Run `ScreenTask.exe`
          3. Click **Start Server**
          4. Open the URL on any device's browser
        files: ScreenTask-${{ env.RELEASE_VER }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
